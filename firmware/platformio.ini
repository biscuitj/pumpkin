; Pumpkin firmware for the Ulanzi TC001 (ESP32-WROOM-32D, 4 MB flash, 8x32 WS2812B)

[env:esp32dev]
platform = espressif32@7.0.1          ; Arduino-ESP32 2.0.17 (ESP-IDF 4.4.7)
board = esp32dev
framework = arduino

board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions_custom.csv
board_build.filesystem = littlefs     ; holds only the enterprise Wi-Fi CA certificate

upload_speed = 115200                 ; the TC001's CH340 is happier slow
monitor_speed = 115200

; pre_build: version + the dashboard embedded from ../dashboard
; post_build: OTA slot size and the image marker
; upload_guard: checks which device upload/erase would write to
extra_scripts =
    pre:scripts/pre_build.py
    post:scripts/post_build.py
    post:scripts/upload_guard.py

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DFASTLED_ESP32_I2S=true
    -Isrc

lib_deps =
    fastled/FastLED@3.10.3
    bblanchon/ArduinoJson@7.4.3
    mathieucarbou/ESPAsyncWebServer@3.6.0
    mathieucarbou/AsyncTCP@3.3.2
